                                  "brand": "Jordan",
                                  "gender": "men",
                                  "description": "The Air Jordan 3 Retro True Blue 2026 is the sixth retro release of one of the four original 1988 Air Jordan 3 colorways, featuring a white tumbled leather upper, Cement Grey elephant print across the toe and heel in a thinner, more refined pattern that closely resembles the 1988 original's specification rather than the heavier print of some previous retros, True Blue accents on the sock liner, Nike Air-branded heel tab, and midsole, a red Jumpman logo on the tongue and tongue interior, and a mostly grey rubber outsole completing the OG-faithful construction. The True Blue Air Jordan 3 is the only one of the model's original 1988 colorways to break from Chicago Bulls colors, relying entirely on color and design to carry its iconic status without team affiliation, representing a pivotal moment in Tinker Hatfield's design demonstrating that the Jordan signature line could succeed outside of the Bulls palette. The 2026 retro also includes the throwback MJ face box packaging that distinguished the 2016 retro, with full family sizing spanning men's at $230, Grade School at $155, Preschool at $95, and Toddler at $80, available simultaneously across Nike SNKRS, Nike.com, Foot Locker, Finish Line, DSG, and Hibbett on release day. The 2026 release marks the tenth anniversary of the most recent 2016 retro and the first time the True Blue has been available since, making it one of the most anticipated Jordan retros of the summer 2026 calendar.<br><br>Released July 18, 2026 at $230 retail via Nike SNKRS and select Jordan Brand retailers globally with style code IF4396-102.<br><br>The Air Jordan 3 Retro True Blue 2026 was released on July 18, 2026 with a retail price of $230.",

                                  "description": "The Air Jordan 7 Retro Miro (2026) brings back one of the most visually unique collaborations in the Jordan archive, originally inspired by the work of Barcelona-based artist Joan Miró. Dressed in white with metallic gold, sport red, and varsity royal accents, the sneaker embraces bold color placement and abstract design language that stands apart from traditional Jordan releases.<br><br>When the Miro concept first appeared in the mid-2000s, it represented a moment where Jordan Brand pushed beyond sports into art-driven storytelling. The mix of vibrant colors and unconventional paneling reflects Miró’s surrealist style, turning the AJ7 into a canvas rather than just a performance model. Over time, it has gained recognition as one of the more experimental and collector-focused Jordan releases.<br><br>When the Air Jordan 7 Retro Miro (2026) released, it retailed for $255. With its white, metallic gold, sport red, and varsity royal colorway, this return highlights a rare moment where art and sneaker design intersected within the Jordan line.",
