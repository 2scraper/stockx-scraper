                                  "description": "The Air Jordan 4 Retro OG Flight Club was one of the most anticipated kicks of early 2026, celebrating an early chapter of MJ fandom with a fresh take on a classic silhouette. Dressed in sail, black, and university red, this retro captures a crisp yet bold look that marries clean neutrals with eye-catching pops of color. The sail leather upper sets a natural base, while a black heel tab and wing eyelets give the sneaker structure and contrast that elevates even the simplest outfit. University red accents on the Jumpman logo bring that classic Jordan color energy to the mix.<br><br>This release channels the spirit of the original Air Jordan Flight Club, the fan membership program from the late 1980s and early 1990s that connected Jordan enthusiasts through newsletters, posters, and exclusive gear. That sense of community and shared passion is woven into this release, with Flight Club logos on the tongue and sockliner tapping into a deeper fan culture that goes beyond just the aesthetic. It’s a sneaker that nods to history while feeling right at home in today’s sneaker scene.<br><br>When the Air Jordan 4 Retro OG Flight Club released, it retailed for $220 and dropped on January 17, 2026. With its refined palette, deep collector roots, and throwback Nike Air branding, it’s a standout addition to any rotation that values authentic story and timeless style.",
